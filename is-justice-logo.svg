<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 232" fill="none">
  <!-- Circle center: (100, 116), radius: 93 -->
  <!-- Gap at top/bottom: 5° on each side of vertical axis -->
  <!-- Top-right gap point: (108.1, 22.9) | Top-left: (91.9, 22.9) -->
  <!-- Bottom-right: (108.1, 209.1) | Bottom-left: (91.9, 209.1) -->

  <!-- Right arc: clockwise from top-right to bottom-right (170°) -->
  <path stroke="#000000" stroke-width="8" stroke-linecap="butt" fill="none"
        d="M 108.1 22.9 A 93 93 0 0 1 108.1 209.1"/>

  <!-- Left arc: clockwise from bottom-left to top-left (170°) -->
  <path stroke="#000000" stroke-width="8" stroke-linecap="butt" fill="none"
        d="M 91.9 209.1 A 93 93 0 0 1 91.9 22.9"/>

  <!-- Vertical center line: extends 17px beyond circle on each side -->
  <line stroke="#000000" stroke-width="8" stroke-linecap="butt"
        x1="100" y1="5" x2="100" y2="227"/>
</svg>
